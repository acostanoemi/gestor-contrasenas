# GitHub Actions: corre los tests solo, en cada push y pull request.
# Este archivo va en:  .github/workflows/tests.yml  (dentro del repo)
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install cryptography pytest

      - name: Correr los tests
        run: pytest -v
